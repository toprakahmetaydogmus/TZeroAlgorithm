name: 'T-Zero Architecture & Quality Guard'
description: 'Enforce modular architectural boundaries, audit code smells, detect secret leaks, and optimize AI tokens.'
author: 'Toprak Ahmet Aydoğmuş (Siber Akademi)'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  workspace:
    description: 'Target project workspace directory to analyze'
    required: false
    default: '.'
  audit:
    description: 'Run AST static code analysis and Zero-Leak security audit'
    required: false
    default: 'true'
  enforce-boundaries:
    description: 'Enforce architectural boundaries defined in tzero.rules.json'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install T-Zero
      shell: bash
      run: python -m pip install --upgrade tzero-mcp

    - name: Run AST Code & Security Audit
      if: ${{ inputs.audit == 'true' }}
      shell: bash
      run: tzero --audit "${{ inputs.workspace }}"

    - name: Enforce Architecture Boundaries
      if: ${{ inputs.enforce-boundaries == 'true' }}
      shell: bash
      run: tzero --enforce-boundaries --dir "${{ inputs.workspace }}"
