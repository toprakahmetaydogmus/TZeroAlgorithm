name: Release

# Builds the Windows executable and publishes it as a GitHub Release.
#   * Push a tag like v3.0.1  -> test, build, and create/update the release.
#   * Run manually (Actions tab) -> test and build only; the .exe is attached to the run as an artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build TZeroAlgorithm.exe
        shell: pwsh
        run: python compile.py

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          if (-not (Test-Path dist\TZeroAlgorithm.exe)) { throw "dist\TZeroAlgorithm.exe was not built" }
          $p = Start-Process -FilePath dist\TZeroAlgorithm.exe -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "TZeroAlgorithm.exe --version exited with code $($p.ExitCode)" }
          $size = (Get-Item dist\TZeroAlgorithm.exe).Length
          Write-Host "Executable OK, size: $size bytes"

      - name: Compute SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\TZeroAlgorithm.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TZeroAlgorithm.exe" | Out-File -Encoding ascii dist\TZeroAlgorithm.exe.sha256
          Write-Host "SHA-256: $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TZeroAlgorithm-windows
          path: |
            dist/TZeroAlgorithm.exe
            dist/TZeroAlgorithm.exe.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TZeroAlgorithm.exe
            dist/TZeroAlgorithm.exe.sha256
          generate_release_notes: true
