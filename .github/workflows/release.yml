name: Release

# Builds the Windows executable and publishes it as a GitHub Release.
#   * Push a version tag like v12.3.1 -> test, build, and create/update the release.
#   * Run manually (Actions tab) -> test and build only; all executables are attached as artifacts.

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

'on':
  push:
    tags:
      - 'v*'
      - 'v[0-9]*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to target (e.g. v12.3.1)'
        required: false
        default: 'v12.3.1'

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            Write-Host "::warning::Tag $env:GITHUB_REF_NAME differs from pyproject.toml version v$version"
          }

      - name: Install dependencies and package
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pyinstaller
          python -m pip install .
          python -m build
          Get-ChildItem dist\*.whl, dist\*.tar.gz | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }

      - name: Verify release metadata (Local-First CI Policy)
        shell: pwsh
        run: python scripts/sync_release_metadata.py --check

      - name: Build TZeroAlgorithm.exe
        shell: pwsh
        run: python scripts/build/compile.py

      - name: Smoke-test executables
        shell: pwsh
        run: |
          python -c '
          import os, subprocess, sys
          exes = ["TZeroAlgorithm.exe", "TZeroMCP.exe", "AddMCP.exe", "TZeroCLI.exe", "TZeroCI.exe"]
          for name in exes:
              path = os.path.join("dist", name)
              if not os.path.isfile(path):
                  raise SystemExit(f"{path} was not built")
              res = subprocess.run([path, "--version"], capture_output=True, text=True, timeout=90)
              if res.returncode != 0:
                  print(res.stdout)
                  print(res.stderr, file=sys.stderr)
                  raise SystemExit(f"{name} --version exited with code {res.returncode}")
              print(f"{name} OK, size: {os.path.getsize(path)} bytes | {(res.stdout or res.stderr).strip()}")
          '

      - name: Set up Node.js for Packages
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package VS Code & Cursor Extension (.vsix)
        shell: bash
        run: |
          mkdir -p dist
          cp LICENSE NOTICE extensions/vscode/ 2>/dev/null || true
          cd extensions/vscode
          npx --yes @vscode/vsce package --no-dependencies -o ../../dist/
          cd ../..
          VSIX=$(ls dist/*.vsix 2>/dev/null | head -n 1)
          if [ -n "$VSIX" ]; then
            sha256sum "$VSIX" | awk '{print $1 "  " $2}' > "${VSIX}.sha256"
            echo "VSIX Packaged: $VSIX"
          fi

      - name: Build npm Package Tarball (.tgz)
        shell: pwsh
        run: |
          cd installers/npm
          npm pack --pack-destination ../../dist
          cd ../..
          Get-ChildItem dist\*.tgz | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
            Write-Host "$($_.Name) SHA-256: $hash"
          }

      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Include *.exe, *.zip -Recurse | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
            Write-Host "$($_.Name) SHA-256: $hash"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TZeroAlgorithm-windows
          path: |
            dist/TZeroAlgorithm.exe
            dist/TZeroAlgorithm.exe.sha256
            dist/TZeroCLI.exe
            dist/TZeroCLI.exe.sha256
            dist/TZeroMCP.exe
            dist/TZeroMCP.exe.sha256
            dist/TZeroCI.exe
            dist/TZeroCI.exe.sha256
            dist/AddMCP.exe
            dist/AddMCP.exe.sha256
            dist/TZero-*.zip
            dist/TZero-*.zip.sha256
            dist/*.vsix
            dist/*.vsix.sha256
            dist/*.whl
            dist/*.whl.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tgz
            dist/*.tgz.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name || 'v12.3.1' }}
          fail_on_unmatched_files: false
          files: |
            dist/TZeroAlgorithm.exe
            dist/TZeroAlgorithm.exe.sha256
            dist/TZeroCLI.exe
            dist/TZeroCLI.exe.sha256
            dist/TZeroMCP.exe
            dist/TZeroMCP.exe.sha256
            dist/TZeroCI.exe
            dist/TZeroCI.exe.sha256
            dist/AddMCP.exe
            dist/AddMCP.exe.sha256
            dist/TZero-*.zip
            dist/TZero-*.zip.sha256
            dist/*.vsix
            dist/*.vsix.sha256
            dist/*.whl
            dist/*.whl.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tgz
            dist/*.tgz.sha256
          generate_release_notes: false

      - name: Upload GitHub Release Assets (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ inputs.tag_name }}") { "${{ inputs.tag_name }}" } else { "v12.2.1" }
          $patterns = @(
            "dist/TZeroAlgorithm.exe", "dist/TZeroAlgorithm.exe.sha256",
            "dist/TZeroCLI.exe", "dist/TZeroCLI.exe.sha256",
            "dist/TZeroMCP.exe", "dist/TZeroMCP.exe.sha256",
            "dist/TZeroCI.exe", "dist/TZeroCI.exe.sha256",
            "dist/AddMCP.exe", "dist/AddMCP.exe.sha256",
            "dist/TZero-*.zip", "dist/TZero-*.zip.sha256",
            "dist/*.vsix", "dist/*.vsix.sha256",
            "dist/*.whl", "dist/*.whl.sha256",
            "dist/*.tar.gz", "dist/*.tar.gz.sha256",
            "dist/*.tgz", "dist/*.tgz.sha256"
          )
          $files = @()
          foreach ($pat in $patterns) {
            $files += Get-Item -Path $pat -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          }
          $files = $files | Sort-Object -Unique
          if ($files.Count -eq 0) { throw "No release assets found in dist/" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "T-Zero $tag" --generate-notes
          }
