name: Release

# Builds the Windows executable and publishes it as a GitHub Release.
#   * Push a version tag like v3.0.3  -> test, build, and create/update the release.
#   * Run manually (Actions tab) -> test and build only; all executables are attached as artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies and package
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install .
          python -m build
          Get-ChildItem dist\*.whl, dist\*.tar.gz | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }

      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build TZeroAlgorithm.exe
        shell: pwsh
        run: python compile.py

      - name: Smoke-test executables
        shell: pwsh
        run: |
          if (-not (Test-Path dist\TZeroAlgorithm.exe)) { throw "dist\TZeroAlgorithm.exe was not built" }
          if (-not (Test-Path dist\TZeroMCP.exe)) { throw "dist\TZeroMCP.exe was not built" }
          if (-not (Test-Path dist\AddMCP.exe)) { throw "dist\AddMCP.exe was not built" }
          foreach ($name in @("TZeroAlgorithm.exe", "TZeroMCP.exe", "AddMCP.exe")) {
            $p = Start-Process -FilePath "dist\$name" -ArgumentList "--version" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$name --version exited with code $($p.ExitCode)" }
            Write-Host "$name OK, size: $((Get-Item "dist\$name").Length) bytes"
          }

      - name: Set up Node.js for VS Code Extension
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package VS Code & Cursor Extension (.vsix)
        shell: pwsh
        run: |
          if (-not (Test-Path dist)) { New-Item -ItemType Directory -Path dist -Force }
          Copy-Item LICENSE extensions\vscode\LICENSE -Force -ErrorAction SilentlyContinue
          npm install -g @vscode/vsce
          cd extensions\vscode
          vsce package --no-dependencies --allow-missing-repository -o ..\..\dist\
          cd ..\..
          $vsix = Get-ChildItem dist\*.vsix | Select-Object -First 1
          if ($vsix) {
            $hash = (Get-FileHash $vsix.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($vsix.Name)" | Out-File -Encoding ascii "$($vsix.FullName).sha256"
            Write-Host "VSIX Packaged: $($vsix.Name) (SHA-256: $hash)"
          }

      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          foreach ($name in @("TZeroAlgorithm.exe", "TZeroMCP.exe", "AddMCP.exe")) {
            $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Out-File -Encoding ascii "dist\$name.sha256"
            Write-Host "$name SHA-256: $hash"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TZeroAlgorithm-windows
          path: |
            dist/TZeroAlgorithm.exe
            dist/TZeroAlgorithm.exe.sha256
            dist/TZeroMCP.exe
            dist/TZeroMCP.exe.sha256
            dist/AddMCP.exe
            dist/AddMCP.exe.sha256
            dist/*.vsix
            dist/*.vsix.sha256
            dist/*.whl
            dist/*.whl.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TZeroAlgorithm.exe
            dist/TZeroAlgorithm.exe.sha256
            dist/TZeroMCP.exe
            dist/TZeroMCP.exe.sha256
            dist/AddMCP.exe
            dist/AddMCP.exe.sha256
            dist/*.vsix
            dist/*.vsix.sha256
            dist/*.whl
            dist/*.whl.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          generate_release_notes: true
