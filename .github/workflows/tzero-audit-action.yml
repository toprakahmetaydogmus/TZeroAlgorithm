name: T-Zero Codebase & Security Guard

concurrency:
  group: tzero-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Local-first security auditing: run via `tzero local-ci` or `python main.py --audit .`.
on:
  workflow_dispatch:

jobs:
  tzero-guard:
    if: "!endsWith(github.actor, '[bot]') && github.actor != 'dependabot'"
    name: AST Context & Zero-Leak Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Run T-Zero Action
        uses: ./
        with:
          mode: 'audit'
          audit-level: 'strict'
          enforce-boundaries: 'false'

