name: T-Zero Codebase & Security Guard

concurrency:
  group: tzero-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - 'benchmark-site/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
      - 'benchmark-site/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  tzero-guard:
    name: AST Context & Zero-Leak Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Run T-Zero Action
        uses: ./
        with:
          mode: 'audit'
          audit-level: 'strict'
          enforce-boundaries: 'false'

