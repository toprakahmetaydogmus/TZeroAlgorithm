name: Publish VS Code / Open VSX Extension

concurrency:
  group: extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      publish_openvsx:
        description: 'Publish to Open VSX Registry (Cursor, Windsurf, VSCodium)'
        type: boolean
        default: true
      publish_vscode:
        description: 'Publish to VS Code Marketplace'
        type: boolean
        default: true

jobs:
  package-and-publish:
    name: Package & Publish VSIX
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package VSIX
        run: |
          mkdir -p dist
          cp LICENSE extensions/vscode/ 2>/dev/null || true
          cd extensions/vscode
          npx --yes @vscode/vsce package --no-dependencies
          mv *.vsix ../../dist/
          cd ../..
          ls -la dist/

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tzero-vscode-vsix
          path: dist/*.vsix

      - name: Publish to Open VSX Registry
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish_openvsx }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT secret is not configured; skipping Open VSX publish."
            exit 0
          fi
          VSIX_PATH=$(ls dist/*.vsix | head -n 1)
          echo "Ensuring Open VSX namespace 'siber-akademi' exists..."
          npx --yes ovsx create-namespace siber-akademi -p "$OVSX_PAT" || true
          echo "Publishing $VSIX_PATH to Open VSX..."
          npx --yes ovsx publish "$VSIX_PATH" -p "$OVSX_PAT"

      - name: Publish to VS Code Marketplace
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish_vscode }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT secret is not configured; skipping VS Code Marketplace publish."
            exit 0
          fi
          VSIX_PATH=$(ls dist/*.vsix | head -n 1)
          echo "Publishing $VSIX_PATH to VS Code Marketplace..."
          npx --yes @vscode/vsce publish --packagePath "$VSIX_PATH" -p "$VSCE_PAT"
