name: Publish VS Code / Open VSX Extension

concurrency:
  group: extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

'on':
  push:
    tags:
      - 'v*'
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      publish_openvsx:
        description: 'Publish to Open VSX Registry (Cursor, Windsurf, VSCodium)'
        type: boolean
        default: true
      publish_vscode:
        description: 'Publish to VS Code Marketplace'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  package-and-publish:
    name: Package & Publish VSIX
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package VSIX
        run: |
          mkdir -p dist
          cp LICENSE extensions/vscode/ 2>/dev/null || true
          cd extensions/vscode
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/v* && "${GITHUB_REF_NAME}" != "v${PACKAGE_VERSION}" ]]; then
            echo "::warning::Tag ${GITHUB_REF_NAME} does not match extension version v${PACKAGE_VERSION}"
          fi
          npx --yes @vscode/vsce package --no-dependencies
          mv *.vsix ../../dist/
          cd ../..
          ls -la dist/

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tzero-vscode-vsix
          path: dist/*.vsix

      - name: Publish to Open VSX Registry
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_openvsx) }}
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          VSIX_PATH=$(ls dist/*.vsix 2>/dev/null | head -n 1)
          if [ -z "$VSIX_PATH" ]; then
            echo "::warning::No VSIX package found to publish to Open VSX."
            exit 0
          fi
          echo "Preparing Open VSX publication for $VSIX_PATH..."
          if [ -n "$OVSX_PAT" ]; then
            echo "Publishing to Open VSX using OVSX_PAT..."
            OUTPUT=$(npx --yes ovsx@1.2.0 publish "$VSIX_PATH" -p "$OVSX_PAT" 2>&1) || {
              STATUS=$?
              echo "$OUTPUT"
              if echo "$OUTPUT" | grep -qi "already published"; then
                echo "::notice::Extension version is already published on Open VSX."
                exit 0
              fi
              echo "::warning::Open VSX publication failed with exit code $STATUS (check OVSX_PAT or rate limits)."
              exit 0
            }
            echo "$OUTPUT"
          else
            echo "OVSX_PAT not set. Attempting Open VSX trusted publishing..."
            OUTPUT=$(npx --yes ovsx@1.2.0 publish "$VSIX_PATH" --trusted-publishing 2>&1) || {
              STATUS=$?
              echo "$OUTPUT"
              if echo "$OUTPUT" | grep -qi "already published"; then
                echo "::notice::Extension version is already published on Open VSX."
                exit 0
              fi
              echo "::warning::Open VSX publishing skipped: OVSX_PAT secret not configured and trusted publishing unavailable."
              exit 0
            }
            echo "$OUTPUT"
          fi

      - name: Publish to VS Code Marketplace
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_vscode) }}
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VSIX_PATH=$(ls dist/*.vsix 2>/dev/null | head -n 1)
          if [ -z "$VSIX_PATH" ]; then
            echo "::warning::No VSIX package found to publish to VS Code Marketplace."
            exit 0
          fi
          echo "Preparing VS Code Marketplace publication for $VSIX_PATH..."
          if [ -n "$VSCE_PAT" ]; then
            echo "Publishing $VSIX_PATH to VS Code Marketplace using VSCE_PAT..."
            npx --yes @vscode/vsce publish --packagePath "$VSIX_PATH" -p "$VSCE_PAT" --skip-duplicate || {
              echo "::warning::VS Code Marketplace publication with VSCE_PAT encountered an issue."
              exit 0
            }
          else
            echo "VSCE_PAT not set. Attempting VS Code Marketplace trusted publishing (--oidc)..."
            npx --yes @vscode/vsce publish --packagePath "$VSIX_PATH" --oidc --skip-duplicate || {
              echo "::warning::VS Code Marketplace publication skipped: VSCE_PAT secret not configured and OIDC not registered."
              exit 0
            }
          fi
