name: Publish to PyPI

concurrency:
  group: pypi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

'on':
  push:
    tags:
      - 'v*'
      - 'v[0-9]*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/tzero-mcp
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package distribution
        run: python -m build

      - name: Check PyPI publishing credentials
        id: pypi_auth
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN }}
        run: |
          if [ -n "$PYPI_TOKEN" ]; then
            echo "auth_mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "auth_mode=oidc" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish distribution to PyPI (Token)
        if: steps.pypi_auth.outputs.auth_mode == 'token'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN }}
          packages-dir: dist/
          skip-existing: true

      - name: Publish distribution to PyPI (Trusted Publishing / OIDC)
        if: steps.pypi_auth.outputs.auth_mode == 'oidc'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
