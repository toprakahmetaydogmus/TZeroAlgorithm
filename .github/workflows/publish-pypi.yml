name: Publish to PyPI

concurrency:
  group: pypi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

'on':
  push:
    tags:
      - 'v*'
      - 'v[0-9]*'
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/tzero-mcp
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package distribution
        run: python -m build

      - name: Publish distribution to PyPI (Token)
        if: ${{ secrets.PYPI_API_TOKEN != '' || secrets.PYPI_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        with:
          password: ${{ secrets.PYPI_API_TOKEN || secrets.PYPI_TOKEN }}
          packages-dir: dist/
          skip-existing: true

      - name: Publish distribution to PyPI (Trusted Publishing / OIDC)
        if: ${{ secrets.PYPI_API_TOKEN == '' && secrets.PYPI_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        with:
          packages-dir: dist/
          skip-existing: true
