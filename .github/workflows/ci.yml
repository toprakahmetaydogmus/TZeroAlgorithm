name: CI Test Suite

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - '**.js'
      - 'tzero/**'
      - 'crates/**'
      - 'extensions/**'
      - 'installers/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Install package and dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install . flake8

    - name: Smoke-test installed CLI and metadata sync
      run: |
        tzero --version
        python scripts/sync_release_metadata.py --check
        python -m compileall -q .
        python -m flake8 --select=E9,F63,F7,F82 --exclude=.git,__pycache__,.venv,venv,installers,extensions,build .

    - name: Run Unit Tests
      run: |
        python -m unittest discover -s tests -p "test_*.py" -v

    - name: Run Node and VS Code Extension Tests
      run: |
        node --test installers/npm/test/package.test.js
        node --test extensions/vscode/test/extension.test.js
        node -c extensions/vscode/src/core.js
        node -c extensions/vscode/src/extension.js

    - name: Run Zero-Leak Secret Audit
      run: |
        python tests/audit_secrets.py

    - name: Zero-Cost Security & Architecture Smoke Tests
      run: |
        python main.py --version
        python main.py --audit .
        python main.py --enforce-rules
        python main.py --diff
        python main.py --export-agent-rules
