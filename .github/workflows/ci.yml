name: CI Test Suite

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'tzero_jarvis/**'
      - 'crates/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package and dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install .

    - name: Smoke-test installed CLI
      run: tzero --version

    - name: Run Unit Tests
      run: |
        python -m unittest discover -s tests -v

    - name: Run Zero-Leak Secret Audit
      run: |
        python tests/audit_secrets.py

    - name: Zero-Cost Security & Architecture Smoke Tests
      run: |
        python main.py --version
        python main.py --audit .
        python main.py --enforce-rules
        python main.py --diff
        python main.py --export-agent-rules
