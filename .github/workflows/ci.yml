name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

'on':
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  checks:
    name: Static, Node, Secret & CLI Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 2

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: 'pip'

    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Install dependencies
      run: python -m pip install --disable-pip-version-check --no-compile . flake8 pyyaml qrcode

    - name: Run metadata sync, lint, Zero-Leak audit, and CLI smoke tests
      run: |
        tzero --version
        python scripts/sync_release_metadata.py --check
        python -m compileall -q tzero
        python -m flake8 --select=E9,F63,F7,F82 --exclude=.git,__pycache__,.venv,venv,installers,extensions,build .
        python tests/audit_secrets.py
        python main.py --version
        python main.py --audit .
        python main.py --enforce-rules
        python main.py --diff
        python main.py --export-agent-rules

    - name: Run Node and VS Code Extension Tests
      run: |
        node --test installers/npm/test/package.test.js
        node --test extensions/vscode/test/extension.test.js
        node -c extensions/vscode/src/core.js
        node -c extensions/vscode/src/extension.js

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.11"
            suite: full
            shard: "1/2"
          - os: ubuntu-24.04
            python-version: "3.11"
            suite: full
            shard: "2/2"
          - os: ubuntu-24.04
            python-version: "3.12"
            suite: full
            shard: "1/2"
          - os: ubuntu-24.04
            python-version: "3.12"
            suite: full
            shard: "2/2"
          - os: windows-latest
            python-version: "3.12"
            suite: cross-os
            shard: "1/1"
          - os: macos-latest
            python-version: "3.12"
            suite: cross-os
            shard: "1/1"

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install package and dependencies
      run: |
        python -m pip install --disable-pip-version-check --no-compile . flake8 pyyaml qrcode

    - name: Run Full Test Suite (Parallel)
      if: matrix.suite == 'full'
      run: |
        python scripts/run_parallel_tests.py --shard ${{ matrix.shard }} tests

    - name: Run Cross-Platform OS & Guard Tests
      if: matrix.suite == 'cross-os'
      run: |
        python scripts/run_parallel_tests.py tests/test_welcome_and_install_ide.py tests/test_hook_opt_in.py tests/test_local_ci.py tests/test_terminal.py tests/test_cli.py tests/test_packaging_sync.py tests/test_ci_workflow.py tests/test_release_dispatch.py tests/test_armor.py
