name: Publish to npm

concurrency:
  group: npm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

'on':
  push:
    tags:
      - 'v*'
      - 'v[0-9]*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  npm-publish:
    name: Publish tzero-mcp to npm
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports Trusted Publishing (OIDC)
        run: npm install -g npm@latest

      - name: Publish package to npm
        env:
          NPM_TOKEN_INPUT: ${{ secrets.NPM_TOKEN }}
        run: |
          cd installers/npm
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          REMOTE_VERSION=$(npm view tzero-mcp version 2>/dev/null || echo "0.0.0")
          echo "Package version: $PACKAGE_VERSION | Remote version: $REMOTE_VERSION"
          if [ "$PACKAGE_VERSION" = "$REMOTE_VERSION" ]; then
            echo "Version $PACKAGE_VERSION is already published on npm. Skipping."
            exit 0
          fi

          if [ -n "$NPM_TOKEN_INPUT" ]; then
            echo "Publishing to npm registry using NPM_TOKEN..."
            NODE_AUTH_TOKEN="$NPM_TOKEN_INPUT" npm publish --access public
          else
            echo "Publishing to npm registry using GitHub Trusted Publishing (OIDC)..."
            npm publish --provenance --access public
          fi
