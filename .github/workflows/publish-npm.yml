name: Publish to npm

concurrency:
  group: npm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  npm-publish:
    name: Publish tzero-mcp to npm
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure modern npm for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Strip any conflicting npmrc auth
        run: |
          if [ -f "$HOME/.npmrc" ]; then
            sed -i '/_authToken/d' "$HOME/.npmrc" || true
          fi
          if [ -n "$NPM_CONFIG_USERCONFIG" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG" || true
          fi

      - name: Publish package to npm
        run: |
          cd installers/npm
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          REMOTE_VERSION=$(npm view tzero-mcp version 2>/dev/null || echo "0.0.0")
          echo "Package version: $PACKAGE_VERSION | Remote version: $REMOTE_VERSION"
          if [ "$PACKAGE_VERSION" = "$REMOTE_VERSION" ]; then
            echo "Version $PACKAGE_VERSION is already published on npm. Skipping."
          else
            npm publish --access public --provenance
          fi

