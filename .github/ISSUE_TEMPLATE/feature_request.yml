name: Feature Request
description: Suggest an idea or enhancement for T-Zero
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for token optimization, new IDE support, or AST pruners? Let us know!
        ⭐ **Support the Project:** If you like T-Zero, please [leave a star on GitHub](https://github.com/toprakahmetaydogmus/TZeroAlgorithm)! Every star helps an independent 15-year-old developer keep T-Zero 100% free.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or LLM context bottleneck?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see in T-Zero.
    validations:
      required: true
