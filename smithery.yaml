# Smithery Configuration for T-Zero Context Architect MCP Server
# Enables one-click installation via Smithery.ai for Cursor, Claude Desktop, Windsurf, Antigravity, and Cline
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'tzero-mcp@latest'],
      env: {}
    })
