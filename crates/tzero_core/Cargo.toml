[package]
name = "tzero-core"
version = "12.3.2"
edition = "2021"
authors = ["Toprak Ahmet Aydoğmuş (Siber Akademi) <siberakademi@org.tr>"]
description = "T-Zero Turbo Rust Hybrid Core — Ultra-High Performance Multi-Language AST Pruning, Shannon Entropy Zero-Leak Guard & BPE Tokenizer"
license = "AGPL-3.0-only"

[lib]
name = "tzero_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tzero-core"
path = "src/main.rs"

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29" }
tree-sitter = "0.22"
tree-sitter-python = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-rust = "0.21"
tree-sitter-go = "0.21"
tiktoken-rs = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
