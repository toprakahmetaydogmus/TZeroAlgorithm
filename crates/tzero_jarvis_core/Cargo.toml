[package]
name = "tzero-jarvis-core"
version = "6.0.0"
edition = "2021"
authors = ["Toprak Ahmet Aydogmus <siberakademi@org.tr>"]
description = "Ultra-Fast 3-Layer Semantic Memory & Autonomous Super-Agent Orchestrator Core for T-Zero"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
regex = "1.10"

[[bin]]
name = "tzero-jarvis"
path = "src/main.rs"

[lib]
name = "tzero_jarvis_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
