<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 370" width="100%" height="auto" style="border-radius: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;">
  <defs>
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffd8" />
      <stop offset="50%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#50fa7b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes progressAnim {
      0% { width: 0px; }
      20% { width: 0px; }
      70% { width: 474px; }
      92% { width: 474px; }
      100% { width: 0px; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes fadeRaw {
      0% { opacity: 0; }
      10%, 90% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes fadePruned {
      0%, 25% { opacity: 0; }
      35%, 90% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes pulseBadge {
      0%, 65% { opacity: 0.6; transform: scale(0.96); }
      80%, 92% { opacity: 1; transform: scale(1.02); }
      100% { opacity: 0.6; transform: scale(0.96); }
    }
    .progress-bar {
      animation: progressAnim 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .cursor-blink {
      animation: blink 1s step-end infinite;
    }
    .raw-section {
      animation: fadeRaw 7s ease-in-out infinite;
    }
    .pruned-section {
      animation: fadePruned 7s ease-in-out infinite;
    }
    .reduction-glow {
      animation: pulseBadge 7s ease-in-out infinite;
      transform-origin: 65px 285px;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="850" height="370" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Terminal Window Header -->
  <rect width="850" height="42" rx="12" fill="#161b22" />
  <rect y="30" width="850" height="12" fill="#161b22" />
  <line x1="0" y1="42" x2="850" y2="42" stroke="#30363d" stroke-width="1" />
  
  <!-- Traffic Light Window Controls -->
  <circle cx="24" cy="21" r="6" fill="#ff5f56" />
  <circle cx="44" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="21" r="6" fill="#27c93f" />
  
  <!-- Terminal Title -->
  <text x="425" y="26" fill="#8b949e" font-size="13" font-weight="600" text-anchor="middle">bash — tzero --savings (Live AST Benchmark)</text>

  <!-- Step 1: Raw Ingestion Command & Output -->
  <g transform="translate(30, 75)" class="raw-section">
    <text x="0" y="0" fill="#58a6ff" font-size="14" font-weight="bold">$</text>
    <text x="16" y="0" fill="#c9d1d9" font-size="14">tzero --raw-tokens --dir ./workspace</text>
    <text x="0" y="26" fill="#f85149" font-size="13">✖ Raw Imperative Ingestion:</text>
    <text x="210" y="26" fill="#f85149" font-size="13" font-weight="bold">166,996 tokens</text>
    <text x="350" y="26" fill="#8b949e" font-size="13">(Internal loops, boilerplate bodies)</text>
  </g>

  <!-- Step 2: T-Zero Compression Command & Output -->
  <g transform="translate(30, 155)" class="pruned-section">
    <text x="0" y="0" fill="#58a6ff" font-size="14" font-weight="bold">$</text>
    <text x="16" y="0" fill="#c9d1d9" font-size="14">tzero --compress --level T-2</text>
    <text x="250" y="0" fill="#58a6ff" font-size="14" class="cursor-blink">▋</text>
    <text x="0" y="26" fill="#3fb950" font-size="13">✔ T-Zero AST Pruning:</text>
    <text x="180" y="26" fill="#3fb950" font-size="13" font-weight="bold">8,465 tokens</text>
    <text x="290" y="26" fill="#8b949e" font-size="13">(Signatures, types, interfaces preserved)</text>
  </g>

  <!-- Live Benchmark Metric Card -->
  <g transform="translate(30, 228)">
    <rect width="790" height="114" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    
    <!-- Reduction Percentage with Glow -->
    <text x="24" y="28" fill="#58a6ff" font-size="12" font-weight="bold" letter-spacing="0.5">CONTEXT TOKEN REDUCTION</text>
    
    <g class="reduction-glow">
      <text x="24" y="62" fill="#3fb950" font-size="30" font-weight="bold" filter="url(#glow)">-94.9%</text>
    </g>
    <text x="165" y="58" fill="#8b949e" font-size="13">Tokens Stripped Without Semantic Information Loss</text>

    <!-- Animated Sliding Progress Bar Track (500px total width) -->
    <rect x="24" y="78" width="500" height="12" rx="6" fill="#21262d" />
    
    <!-- Moving/Sliding Fill: slides from 0px to 474px (which represents 94.9%) -->
    <rect x="24" y="78" width="474" height="12" rx="6" fill="url(#progressGrad)" class="progress-bar">
      <!-- SMIL Fallback for SVG viewers without full CSS keyframe support -->
      <animate attributeName="width" values="0; 0; 474; 474; 0" keyTimes="0; 0.2; 0.7; 0.92; 1" dur="7s" repeatCount="indefinite" />
    </rect>

    <!-- Percentage Marks below bar -->
    <text x="24" y="104" fill="#6e7681" font-size="10">0%</text>
    <text x="260" y="104" fill="#6e7681" font-size="10">50%</text>
    <text x="480" y="104" fill="#3fb950" font-size="10" font-weight="bold">94.9%</text>

    <!-- Right Side Badges -->
    <rect x="575" y="22" width="195" height="32" rx="6" fill="#238636" fill-opacity="0.15" stroke="#2ea043" stroke-width="1" />
    <text x="672" y="43" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">✔ Zero-Leak Local Keyring</text>

    <rect x="575" y="64" width="195" height="32" rx="6" fill="#1f6feb" fill-opacity="0.15" stroke="#388bfd" stroke-width="1" />
    <text x="672" y="85" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">⚡ 47 Native MCP Tools</text>
  </g>
</svg>
