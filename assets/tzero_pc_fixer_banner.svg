<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#0f0c24" />
      <stop offset="100%" stop-color="#180b30" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 27, 75, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 12, 40, 0.85)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="180" fill="#6366f1" opacity="0.18" filter="url(#glow)" />
  <circle cx="1000" cy="450" r="220" fill="#a855f7" opacity="0.15" filter="url(#glow)" />
  <circle cx="600" cy="300" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />

  <!-- Subtle Cyber Grid -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Brand Badge -->
  <g transform="translate(80, 70)">
    <rect width="320" height="38" rx="19" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1" />
    <circle cx="22" cy="19" r="6" fill="#10b981" />
    <text x="38" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e0e7ff" letter-spacing="1">
      SOVEREIGN MASTER v10.5.0
    </text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
    T-Zero PC-Fixer &amp; Codebase Doctor
  </text>
  <text x="80" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="500" fill="url(#accent)">
    Autonomous Self-Healing OS &amp; Codebase Intelligence (12,650+ Lines)
  </text>

  <!-- 4 Feature Cards -->
  <g transform="translate(80, 270)">
    <!-- Card 1: AST Healer -->
    <rect x="0" y="0" width="240" height="150" rx="14" fill="url(#card-bg)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="20" y="42" font-size="24">🩺</text>
    <text x="20" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#ffffff">AST Syntax Healer</text>
    <text x="20" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      Missing colons, quotes,
    </text>
    <text x="20" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      indents &amp; Py2/3 prints
    </text>

    <!-- Card 2: Git VCS Surgeon -->
    <rect x="265" y="0" width="240" height="150" rx="14" fill="url(#card-bg)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="285" y="42" font-size="24">⚡</text>
    <text x="285" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Git VCS Surgeon</text>
    <text x="285" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      Stale index.lock removal,
    </text>
    <text x="285" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      detached HEAD rescue
    </text>

    <!-- Card 3: Packaging & ABI -->
    <rect x="530" y="0" width="240" height="150" rx="14" fill="url(#card-bg)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="550" y="42" font-size="24">📦</text>
    <text x="550" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Packaging &amp; ABI</text>
    <text x="550" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      PEP 517/621 pyproject,
    </text>
    <text x="550" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      pyvenv.cfg &amp; dist-info
    </text>

    <!-- Card 4: Hardware & Ports -->
    <rect x="795" y="0" width="240" height="150" rx="14" fill="url(#card-bg)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="815" y="42" font-size="24">🛡️</text>
    <text x="815" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Zero-Leak &amp; Ports</text>
    <text x="815" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      Port 3000/5000/8000 killer,
    </text>
    <text x="815" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      CWE-78/89 &amp; .env migrator
    </text>
  </g>

  <!-- Terminal Installation Box -->
  <g transform="translate(80, 460)">
    <rect width="1035" height="100" rx="12" fill="#030712" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" />
    <!-- Traffic lights -->
    <circle cx="28" cy="24" r="5.5" fill="#ef4444" />
    <circle cx="46" cy="24" r="5.5" fill="#f59e0b" />
    <circle cx="64" cy="24" r="5.5" fill="#10b981" />
    <text x="85" y="29" font-family="'Fira Code', monospace" font-size="13" fill="#64748b">bash - 1-click universal install (Linux / macOS / Windows)</text>

    <!-- Command text -->
    <text x="28" y="70" font-family="'Fira Code', monospace" font-size="17" font-weight="600" fill="#38bdf8">
      $ curl -fsSL https://raw.githubusercontent.com/toprakahmetaydogmus/tzero-pc-fixer/main/install.sh | bash
    </text>
  </g>

  <!-- Footer Tags -->
  <text x="80" y="595" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b">
    100% Free &amp; Local Offline  •  Zero Cloud APIs ($0.00 Spend)  •  Native JSON-RPC 2.0 MCP Protocol  •  Atomic Rollback Engine
  </text>
  <text x="940" y="595" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a855f7">
    Siber Akademi T-Zero R&amp;D
  </text>
</svg>