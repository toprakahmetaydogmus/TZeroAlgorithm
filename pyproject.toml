[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tzero-algorithm"
version = "3.0.0"
description = "Enterprise Codebase Context Builder, AST Signatures Analyzer, & Token Reducer for LLMs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Toprak Ahmet Aydoğmuş", email = "toprakahmetileq@gmail.com" }
]
keywords = [
    "context-builder",
    "token-reduction",
    "llm-context",
    "ast-analysis",
    "codebase-map",
    "cursor",
    "copilot",
    "prompt-engineering"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "requests>=2.28.0",
    "keyring>=23.13.1",
    "darkdetect>=0.8.0",
    "pygments>=2.14.0",
    "Pillow>=9.0.0",
    "mcp>=1.0.0"
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0.0"
]
test = [
    "pytest>=7.0.0"
]

[project.scripts]
tzero = "main:main"
tzero-mcp = "tzero_mcp:main"

[project.urls]
Homepage = "https://utspro.co"
Biography = "https://hopp.bio/siberegitim"
Repository = "https://github.com/toprakahmetaydogmus/TZeroAlgorithm"
Documentation = "https://github.com/toprakahmetaydogmus/TZeroAlgorithm#readme"
