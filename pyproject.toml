[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tzero-mcp"
version = "7.3.4"
description = "Enterprise Codebase Context Builder, AST Signatures Analyzer, & Token Reducer for LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Toprak Ahmet Aydoğmuş", email = "siberakademi@org.tr" }
]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "claude",
    "claude-code",
    "claude-desktop",
    "cursor",
    "windsurf",
    "cline",
    "copilot",
    "context-builder",
    "token-reduction",
    "token-optimizer",
    "token-saver",
    "ast-analysis",
    "ast-parser",
    "codebase-context",
    "context-window",
    "rag",
    "code-intelligence",
    "developer-tools",
    "zero-leak",
    "security-guard",
    "prompt-engineering",
    "pre-commit",
    "swift",
    "kotlin"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security"
]
dependencies = [
    "requests>=2.28.0",
    "keyring>=23.13.1",
    "darkdetect>=0.8.0",
    "pygments>=2.14.0",
    "Pillow>=9.0.0",
    "mcp>=1.0.0",
    "typer>=0.9.0"
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0.0"
]
test = [
    "pytest>=7.0.0"
]

[project.scripts]
tzero = "main:main"
tzero-gui = "tzero_v3:launch_gui"
tzero-mcp = "tzero_mcp:main"
tzero-add-mcp = "addmcp:main"
tzero-addmcp = "addmcp:main"
tzero-guard = "tzero_guard:main"

[tool.setuptools]
packages = ["tzero_jarvis"]
py-modules = [
    "main",
    "tzero",
    "tzero_features",
    "tzero_mcp",
    "tzero_v3",
    "tzero_deps",
    "addmcp",
    "siber_akademi_icon",
    "app",
    "tzero_guard",
    "tzero_patch",
    "tzero_superdesign",
    "tzero_gateway",
    "tzero_infra",
    "tzero_pipe",
    "tzero_polyglot",
    "tzero_reachability",
    "tzero_dashboard"
]

[tool.setuptools.package-data]
"*" = ["*.ico", "*.json"]

[project.urls]
Homepage = "https://github.com/toprakahmetaydogmus/TZeroAlgorithm"
Repository = "https://github.com/toprakahmetaydogmus/TZeroAlgorithm"
Documentation = "https://github.com/toprakahmetaydogmus/TZeroAlgorithm#readme"
"Bug Tracker" = "https://github.com/toprakahmetaydogmus/TZeroAlgorithm/issues"
Changelog = "https://github.com/toprakahmetaydogmus/TZeroAlgorithm/blob/main/CHANGELOG.md"
"Live Demo" = "https://huggingface.co/spaces/toprakke4/tzero-token-reducer"
Benchmark = "https://tzero-indol.vercel.app"
Discussions = "https://github.com/toprakahmetaydogmus/TZeroAlgorithm/discussions"
LinkedIn = "https://linkedin.com/in/toprak-ahmet-aydo%C4%9Fmu%C5%9F-60462534b/"
Biography = "https://hopp.bio/siberegitim"
