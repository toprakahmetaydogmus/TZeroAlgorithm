[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tzero-mcp"
version = "10.9.0"
description = "Enterprise Codebase Context Builder, AST Signatures Analyzer, & Token Reducer for LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Toprak Ahmet Aydoğmuş", email = "siberakademi@org.tr" }
]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "claude",
    "claude-code",
    "claude-desktop",
    "cursor",
    "windsurf",
    "cline",
    "copilot",
    "context-builder",
    "token-reduction",
    "token-optimizer",
    "token-saver",
    "ast-analysis",
    "ast-parser",
    "codebase-context",
    "context-window",
    "rag",
    "code-intelligence",
    "developer-tools",
    "zero-leak",
    "security-guard",
    "prompt-engineering",
    "pre-commit",
    "swift",
    "kotlin"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security"
]
dependencies = [
    "requests>=2.28.0",
    "keyring>=23.13.1",
    "darkdetect>=0.8.0",
    "pygments>=2.14.0",
    "Pillow>=9.0.0",
    "mcp>=1.0.0"
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0.0"
]
test = [
    "pytest>=7.0.0"
]
space = [
    "gradio>=4.0.0"
]

[project.scripts]
tzero = "tzero_v3:main"
tzero-gui = "tzero_v3:launch_gui"
tzero-tui = "tzero_tui:main"
tzero-mcp = "tzero_mcp:main"
pc-fixer-mcp = "pc_fixer_mcp:main"
tzero-add-mcp = "addmcp:main"
tzero-addmcp = "addmcp:main"
tzero-guard = "tzero_guard:main"
tzero-sync = "tzero_sync:main"
tzero-cost = "tzero_cost:main"
tzero-drift = "tzero_drift:main"
tzero-fixer = "tzero_v3:main"
tzero-explain = "tzero_v3:main"

[tool.setuptools]
packages = ["tzero_jarvis", "tzero_fixer"]
py-modules = [
    "main",
    "tzero",
    "tzero_features",
    "tzero_mcp",
    "tzero_v3",
    "tzero_deps",
    "addmcp",
    "siber_akademi_icon",
    "app",
    "pc_fixer_mcp",
    "tzero_arch_test",
    "tzero_benchmark",
    "tzero_blackboard",
    "tzero_bridge",
    "tzero_budget",
    "tzero_ci",
    "tzero_commit",
    "tzero_contracts",
    "tzero_cost",
    "tzero_dashboard",
    "tzero_debt",
    "tzero_drift",
    "tzero_explain",
    "tzero_fix",
    "tzero_golden",
    "tzero_guard",
    "tzero_infra",
    "tzero_mutation",
    "tzero_neural_cortex",
    "tzero_packer",
    "tzero_patch",
    "tzero_pc_fixer",
    "tzero_pipe",
    "tzero_polyglot",
    "tzero_reachability",
    "tzero_replay",
    "tzero_security",
    "tzero_semantic_merge",
    "tzero_snapshot",
    "tzero_stubs",
    "tzero_subagent_engine",
    "tzero_superdesign",
    "tzero_sync",
    "tzero_task_benchmark",
    "tzero_tui",
    "tzero_turbo"
]

[tool.setuptools.package-data]
"*" = ["*.ico", "*.json"]

[project.urls]
Homepage = "https://github.com/toprakahmetaydogmus/TZeroAlgorithm"
Repository = "https://github.com/toprakahmetaydogmus/TZeroAlgorithm"
Documentation = "https://github.com/toprakahmetaydogmus/TZeroAlgorithm#readme"
"Bug Tracker" = "https://github.com/toprakahmetaydogmus/TZeroAlgorithm/issues"
Changelog = "https://github.com/toprakahmetaydogmus/TZeroAlgorithm/blob/main/CHANGELOG.md"
"Live Demo" = "https://huggingface.co/spaces/toprakke4/tzero-token-reducer"
Benchmark = "https://tzero-indol.vercel.app"
Discussions = "https://github.com/toprakahmetaydogmus/TZeroAlgorithm/discussions"
LinkedIn = "https://linkedin.com/in/toprak-ahmet-aydo%C4%9Fmu%C5%9F-60462534b/"
Biography = "https://hopp.bio/siberegitim"
