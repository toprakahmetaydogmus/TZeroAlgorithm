- id: tzero-guard
  name: T-Zero Zero-Leak Security Guard
  description: Intercepts git commits, scanning staged changes for API keys, tokens, and secrets
  entry: tzero-guard .
  language: python
  pass_filenames: false

- id: tzero-audit
  name: T-Zero Code Quality & Security Audit
  description: AST static analysis, code smell detection, and zero hardcoded secrets verification
  entry: tzero --audit .
  language: python
  types: [python]
  pass_filenames: false

- id: tzero-boundaries
  name: T-Zero Architectural Boundary Enforcer
  description: Validates modular boundaries defined in tzero.rules.json
  entry: tzero --enforce-boundaries
  language: python
  types: [python]
  pass_filenames: false
